Não, você mudou todo o layout, volte para esta versão, e altere apenas o som:
<br>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<br><br>
  <title>Countdown Go Live</title>
<br><br>
  <style>
    * {
      box-sizing: border-box;
    }
<br><br>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
      cursor: default;
    }
<br><br>
    .countdown-container {
      text-align: center;
      padding: 40px;
    }
<br><br>
    .title {
      font-size: clamp(24px, 4vw, 48px);
      font-weight: 400;
      margin-bottom: 30px;
<br><br>
      transition:
        color 0.2s ease,
        text-shadow 0.2s ease;
    }
<br><br>
    #countdown {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
    }
<br><br>
    .time {
      min-width: 100px;
    }
<br><br>
    .number {
      display: block;
      font-size: clamp(42px, 8vw, 90px);
      font-weight: 700;
      line-height: 1;
<br><br>
      transition:
        color 0.2s ease,
        text-shadow 0.2s ease,
        -webkit-text-stroke 0.2s ease;
    }
<br><br>
    .label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #777;
<br><br>
      transition:
        color 0.2s ease,
        text-shadow 0.2s ease;
    }
<br><br><br>
    /* =========================================
       EFEITO VERMELHO
       00, 05, 10, 15, 20 ... 55
       ========================================= */
<br><br>
    .countdown-container.alert .title,
    .countdown-container.alert .label {
      color: #d90000;
<br><br>
      text-shadow:
        0 0 4px rgba(255, 0, 0, 0.25),
        0 0 8px rgba(255, 0, 0, 0.12);
    }
<br><br>
    .countdown-container.alert .number {
      color: #ff1a1a;
<br><br>
      /* Borda fina vermelho escuro */
      -webkit-text-stroke: 0.7px #7a0000;
<br><br>
      /* Glow vermelho suave */
      text-shadow:
        0 0 4px rgba(255, 0, 0, 0.35),
        0 0 8px rgba(255, 0, 0, 0.20),
        0 0 14px rgba(160, 0, 0, 0.10);
    }
<br><br><br>
    /* =========================================
       AVISO PARA ATIVAR O SOM
       ========================================= */
<br><br>
    #soundStatus {
      margin-top: 28px;
      height: 18px;
<br><br>
      font-size: 12px;
      color: #999999;
<br><br>
      letter-spacing: 1px;
<br><br>
      opacity: 0;
<br><br>
      transition:
        opacity 0.4s ease,
        color 0.3s ease;
<br><br>
      cursor: pointer;
      user-select: none;
    }
<br><br>
    #soundStatus.visible {
      opacity: 1;
    }
<br><br>
    #soundStatus.success {
      color: #777777;
    }
<br><br><br>
    /* =========================================
       RESPONSIVO
       ========================================= */
<br><br>
    @media (max-width: 600px) {
<br><br>
      #countdown {
        gap: 14px;
      }
<br><br>
      .time {
        min-width: 60px;
      }
<br><br>
      .label {
        font-size: 10px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>
<br><br>
<body>
<br><br>
  <main
    class="countdown-container"
    id="countdownContainer"
  >
<br><br>
    <div class="title">
      Faltam
    </div>
<br><br><br>
    <div id="countdown">
<br><br>
      <div class="time">
<br><br>
        <span
          class="number"
          id="days"
        >
          00
        </span>
<br><br>
        <span class="label">
          Dias
        </span>
<br><br>
      </div>
<br><br><br>
      <div class="time">
<br><br>
        <span
          class="number"
          id="hours"
        >
          00
        </span>
<br><br>
        <span class="label">
          Horas
        </span>
<br><br>
      </div>
<br><br><br>
      <div class="time">
<br><br>
        <span
          class="number"
          id="minutes"
        >
          00
        </span>
<br><br>
        <span class="label">
          Minutos
        </span>
<br><br>
      </div>
<br><br><br>
      <div class="time">
<br><br>
        <span
          class="number"
          id="seconds"
        >
          00
        </span>
<br><br>
        <span class="label">
          Segundos
        </span>
<br><br>
      </div>
<br><br>
    </div>
<br><br><br>
    <div
      class="title"
      style="
        margin-top: 30px;
        margin-bottom: 0;
      "
    >
      para o Go Live
    </div>
<br><br><br>
    <div id="soundStatus">
      🔊 Clique para ativar o som
    </div>
<br><br>
  </main>
<br><br><br>
  <script>
<br><br>
    /* =========================================
       CONFIGURAÇÃO DO COUNTDOWN
       ========================================= */
<br><br>
    const goLive = new Date(
      "2026-12-14T10:00:00-03:00"
    ).getTime();
<br><br><br>
    const countdownContainer =
      document.getElementById(
        "countdownContainer"
      );
<br><br><br>
    const soundStatus =
      document.getElementById(
        "soundStatus"
      );
<br><br><br>
    /* =========================================
       SISTEMA DE ÁUDIO
       ========================================= */
<br><br>
    let audioContext = null;
<br><br>
    let soundEnabled = false;
<br><br>
    let audioAttempted = false;
<br><br><br>
    /* =========================================
       CRIAR AUDIO CONTEXT
       ========================================= */
<br><br>
    function createAudioContext() {
<br><br>
      if (audioContext) {
        return audioContext;
      }
<br><br><br>
      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;
<br><br><br>
      if (!AudioContextClass) {
<br><br>
        console.log(
          "Web Audio API não suportada."
        );
<br><br>
        return null;
      }
<br><br><br>
      audioContext =
        new AudioContextClass();
<br><br><br>
      return audioContext;
    }
<br><br><br>
    /* =========================================
       SOM DE TIC
       ========================================= */
<br><br>
    function playTick() {
<br><br>
      if (
        !soundEnabled ||
        !audioContext ||
        audioContext.state !== "running"
      ) {
        return;
      }
<br><br><br>
      const now =
        audioContext.currentTime;
<br><br><br>
      const oscillator =
        audioContext.createOscillator();
<br><br><br>
      const gain =
        audioContext.createGain();
<br><br><br>
      oscillator.connect(gain);
<br><br>
      gain.connect(
        audioContext.destination
      );
<br><br><br>
      /*
        Frequência do tic.
<br><br>
        Quanto maior o valor,
        mais agudo será o som.
      */
<br><br>
      oscillator.frequency.setValueAtTime(
        1100,
        now
      );
<br><br><br>
      oscillator.type = "sine";
<br><br><br>
      /*
        Volume inicial
      */
<br><br>
      gain.gain.setValueAtTime(
        0.08,
        now
      );
<br><br><br>
      /*
        Redução rápida do volume,
        criando o efeito de "tic".
      */
<br><br>
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.05
      );
<br><br><br>
      oscillator.start(now);
<br><br>
      oscillator.stop(
        now + 0.05
      );
    }
<br><br><br>
    /* =========================================
       SOM DE CONFIRMAÇÃO
       ========================================= */
<br><br>
    function playConfirmationTick() {
<br><br>
      if (
        !audioContext ||
        audioContext.state !== "running"
      ) {
        return;
      }
<br><br><br>
      const now =
        audioContext.currentTime;
<br><br><br>
      const oscillator =
        audioContext.createOscillator();
<br><br><br>
      const gain =
        audioContext.createGain();
<br><br><br>
      oscillator.connect(gain);
<br><br>
      gain.connect(
        audioContext.destination
      );
<br><br><br>
      oscillator.frequency.setValueAtTime(
        900,
        now
      );
<br><br><br>
      oscillator.type = "sine";
<br><br><br>
      gain.gain.setValueAtTime(
        0.06,
        now
      );
<br><br><br>
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.07
      );
<br><br><br>
      oscillator.start(now);
<br><br>
      oscillator.stop(
        now + 0.07
      );
    }
<br><br><br>
    /* =========================================
       ESCONDE AVISO DE SOM
       ========================================= */
<br><br>
    function hideSoundMessage() {
<br><br>
      soundStatus.classList.remove(
        "visible"
      );
<br><br><br>
      setTimeout(() => {
<br><br>
        soundStatus.textContent = "";
<br><br>
      }, 400);
    }
<br><br><br>
    /* =========================================
       MOSTRA FALLBACK
       ========================================= */
<br><br>
    function showSoundFallback() {
<br><br>
      soundStatus.textContent =
        "🔊 Clique para ativar o som";
<br><br><br>
      soundStatus.classList.add(
        "visible"
      );
<br><br><br>
      soundStatus.classList.remove(
        "success"
      );
    }
<br><br><br>
    /* =========================================
       TENTATIVA DE AUTOPLAY
       ========================================= */
<br><br>
    async function attemptAutoplay() {
<br><br>
      if (audioAttempted) {
        return;
      }
<br><br><br>
      audioAttempted = true;
<br><br><br>
      const context =
        createAudioContext();
<br><br><br>
      if (!context) {
<br><br>
        soundStatus.textContent =
          "Áudio não suportado neste navegador";
<br><br><br>
        soundStatus.classList.add(
          "visible"
        );
<br><br><br>
        return;
      }
<br><br><br>
      try {
<br><br>
        /*
          Tenta ativar o AudioContext
          automaticamente.
        */
<br><br>
        if (
          context.state === "suspended"
        ) {
<br><br>
          await context.resume();
<br><br>
        }
<br><br><br>
        /*
          Verifica se o navegador
          realmente liberou o áudio.
        */
<br><br>
        if (
          context.state === "running"
        ) {
<br><br>
          soundEnabled = true;
<br><br><br>
          console.log(
            "Autoplay liberado."
          );
<br><br><br>
          hideSoundMessage();
<br><br><br>
          /*
            Pequeno som para confirmar
            que o áudio foi liberado.
          */
<br><br>
          playConfirmationTick();
<br><br>
        } else {
<br><br>
          /*
            Navegador bloqueou autoplay.
          */
<br><br>
          soundEnabled = false;
<br><br><br>
          console.log(
            "Autoplay bloqueado. " +
            "Aguardando interação."
          );
<br><br><br>
          showSoundFallback();
        }
<br><br>
      } catch (error) {
<br><br>
        soundEnabled = false;
<br><br><br>
        console.log(
          "Autoplay bloqueado:",
          error
        );
<br><br><br>
        showSoundFallback();
      }
    }
<br><br><br>
    /* =========================================
       FALLBACK POR CLIQUE
       ========================================= */
<br><br>
    async function enableSoundByInteraction() {
<br><br>
      /*
        Se o autoplay já funcionou,
        não precisamos fazer nada.
      */
<br><br>
      if (soundEnabled) {
        return;
      }
<br><br><br>
      const context =
        createAudioContext();
<br><br><br>
      if (!context) {
        return;
      }
<br><br><br>
      try {
<br><br>
        await context.resume();
<br><br><br>
        if (
          context.state === "running"
        ) {
<br><br>
          soundEnabled = true;
<br><br><br>
          soundStatus.textContent =
            "✓ Som ativado";
<br><br><br>
          soundStatus.classList.add(
            "visible",
            "success"
          );
<br><br><br>
          playConfirmationTick();
<br><br><br>
          /*
            Remove os eventos porque
            não são mais necessários.
          */
<br><br>
          document.removeEventListener(
            "click",
            enableSoundByInteraction
          );
<br><br><br>
          document.removeEventListener(
            "touchstart",
            enableSoundByInteraction
          );
<br><br><br>
          /*
            Esconde a mensagem após
            um pequeno intervalo.
          */
<br><br>
          setTimeout(() => {
<br><br>
            hideSoundMessage();
<br><br>
          }, 800);
        }
<br><br>
      } catch (error) {
<br><br>
        console.log(
          "Não foi possível ativar o áudio:",
          error
        );
<br><br><br>
        showSoundFallback();
      }
    }
<br><br><br>
    /* =========================================
       EVENTOS DE FALLBACK
       ========================================= */
<br><br>
    document.addEventListener(
      "click",
      enableSoundByInteraction
    );
<br><br><br>
    document.addEventListener(
      "touchstart",
      enableSoundByInteraction,
      {
        passive: true
      }
    );
<br><br><br>
    /* =========================================
       COUNTDOWN
       ========================================= */
<br><br>
    function updateCountdown() {
<br><br>
      const now =
        new Date().getTime();
<br><br><br>
      const distance =
        goLive - now;
<br><br><br>
      /* =======================================
         COUNTDOWN FINALIZADO
         ======================================= */
<br><br>
      if (distance <= 0) {
<br><br>
        document.getElementById(
          "days"
        ).textContent = "00";
<br><br><br>
        document.getElementById(
          "hours"
        ).textContent = "00";
<br><br><br>
        document.getElementById(
          "minutes"
        ).textContent = "00";
<br><br><br>
        document.getElementById(
          "seconds"
        ).textContent = "00";
<br><br><br>
        countdownContainer
          .classList
          .remove("alert");
<br><br><br>
        return;
      }
<br><br><br>
      /* =======================================
         CALCULA TEMPO
         ======================================= */
<br><br>
      const days =
        Math.floor(
          distance /
          (1000 * 60 * 60 * 24)
        );
<br><br><br>
      const hours =
        Math.floor(
          (
            distance %
            (1000 * 60 * 60 * 24)
          ) /
          (1000 * 60 * 60)
        );
<br><br><br>
      const minutes =
        Math.floor(
          (
            distance %
            (1000 * 60 * 60)
          ) /
          (1000 * 60)
        );
<br><br><br>
      const seconds =
        Math.floor(
          (
            distance %
            (1000 * 60)
          ) /
          1000
        );
<br><br><br>
      /* =======================================
         ATUALIZA TELA
         ======================================= */
<br><br>
      document.getElementById(
        "days"
      ).textContent =
        String(days).padStart(
          2,
          "0"
        );
<br><br><br>
      document.getElementById(
        "hours"
      ).textContent =
        String(hours).padStart(
          2,
          "0"
        );
<br><br><br>
      document.getElementById(
        "minutes"
      ).textContent =
        String(minutes).padStart(
          2,
          "0"
        );
<br><br><br>
      document.getElementById(
        "seconds"
      ).textContent =
        String(seconds).padStart(
          2,
          "0"
        );
<br><br><br>
      /* =======================================
         EFEITO VERMELHO
<br><br>
         00
         05
         10
         15
         20
         25
         30
         35
         40
         45
         50
         55
         ======================================= */
<br><br>
      if (
        seconds % 5 === 0
      ) {
<br><br>
        countdownContainer
          .classList
          .add("alert");
<br><br>
      } else {
<br><br>
        countdownContainer
          .classList
          .remove("alert");
<br><br>
      }
<br><br><br>
      /* =======================================
         TIC
         ======================================= */
<br><br>
      playTick();
    }
<br><br><br>
    /* =========================================
       INICIALIZAÇÃO
       ========================================= */
<br><br>
    updateCountdown();
<br><br><br>
    /*
      Primeiro tenta liberar o som
      automaticamente.
    */
<br><br>
    attemptAutoplay();
<br><br><br>
    /*
      Atualiza o countdown
      a cada segundo.
    */
<br><br>
    setInterval(
      updateCountdown,
      1000
    );
<br><br>
  </script>
<br><br>
</body>
</html>
